<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		<script>
			// Set the initial background view before the page is painted.
			(function () {
				document.documentElement.dataset.backgroundView =
					window.location.hash === '#education' ? 'education' : 'experience';

				// Prevent a flash of the wrong theme, even when storage is unavailable.
				let savedTheme;
				try {
					savedTheme = window.localStorage.getItem('theme');
				} catch {
					// Use the system preference for this visit.
				}
				const theme =
					(savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : null) ||
					(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
				if (theme === 'dark') {
					document.documentElement.classList.add('dark');
				} else {
					document.documentElement.classList.remove('dark');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
